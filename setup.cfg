[metadata]
name = cvmfsutils
description = Inspect CernVM-FS repositories
long_description = file: README.md
long_description_content_type = text/markdown
license = (c) 2015 CERN - BSD License
author = Rene Meusel
author_email = rene.meusel@cern.ch
url = http://cernvm.cern.ch
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    License :: OSI Approved :: BSD License
    Natural Language :: English
    Operating System :: POSIX :: Linux
    Operating System :: MacOS :: MacOS X
    Topic :: Software Development
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: System :: Filesystems
    Topic :: System :: Networking :: Monitoring
    Topic :: System :: Systems Administration

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.6
install_requires =
    python-dateutil >= 1.4.1
    requests >= 1.1.0
    cryptography >= 3.3

[options.packages.find]
where = src
exclude =
    *.test*

[options.extras_require]
test = unittest-xml-reporting

[options.entry_points]
console_scripts =
    big_catalogs = cvmfs.scripts.big_catalogs:main
    catdirusage = cvmfs.scripts.catdirusage:main
    cvmfs_search = cvmfs.scripts.cvmfs_search:main
    cvmfs_overlap = cvmfs.scripts.cvmfs_overlap:main
    download_catalogs = cvmfs.scripts.download_catalogs:main
    analyze_images = cvmfs.scripts.analyze_images:main
    count_files = cvmfs.scripts.count_files:main
    list_objects = cvmfs.scripts.list_objects:main
